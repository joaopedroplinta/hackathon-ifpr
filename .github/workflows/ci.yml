name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'
  NODE_VERSION: '24'

jobs:
  qualidade:
    name: Lint e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Pint (formatação PHP)
        run: ./vendor/bin/pint --test

      # lint:check, não lint — `npm run lint` roda eslint --fix, corrige em
      # silêncio e sai com 0. Em CI isso aprova qualquer coisa.
      - name: ESLint
        run: npm run lint:check

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npx tsc --noEmit

  testes:
    name: Testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hackathon_test
          POSTGRES_USER: hackathon
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: hackathon_test
      DB_USERNAME: hackathon
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, mbstring, bcmath, gd, zip
          coverage: none

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      # Os testes renderizam a root view, que usa @vite.
      # Sem build, o manifest não existe e toda feature test quebra.
      - name: Build dos assets
        run: npm run build

      - name: Migrations
        run: php artisan migrate --force

      - name: Pest
        run: ./vendor/bin/pest --colors=always
