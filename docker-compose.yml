services:
  postgres:
    image: postgres:17-alpine
    container_name: hackathon-postgres
    environment:
      POSTGRES_DB: hackathon
      POSTGRES_USER: hackathon
      POSTGRES_PASSWORD: secret
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Cria o banco de testes junto com o de desenvolvimento
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hackathon -d hackathon']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hackathon-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: hackathon-mailpit
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # interface web
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres-data:
