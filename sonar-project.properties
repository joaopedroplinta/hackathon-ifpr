# Análise local do SonarQube (Community). Token e URL ficam fora do arquivo:
#
#   php artisan test --coverage-clover=coverage/clover.xml   # PHP (precisa de pcov)
#   npm run test:coverage                                    # front: coverage/lcov.info
#   sonar-scanner -Dsonar.host.url=http://127.0.0.1:9000 -Dsonar.token=$SONAR_TOKEN
sonar.projectKey=hackathon-ifpr
sonar.projectName=hackathon-ifpr

sonar.sources=app,routes,database,config,resources/js,resources/views
sonar.tests=tests
sonar.exclusions=**/vendor/**,**/node_modules/**,public/build/**,resources/js/components/ui/**,**/*.test.ts,**/*.test.tsx,resources/js/test/**

sonar.php.coverage.reportPaths=coverage/clover.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Fora da cobertura: código declarativo ou que só roda no banco/boot, sem lógica a testar.
sonar.coverage.exclusions=database/migrations/**,database/seeders/**,routes/**,config/**,resources/js/app.tsx,resources/js/ssr.jsx
